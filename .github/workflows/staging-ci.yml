name: Deploy Staging

on:
  push:
    branches:
      - staging
    paths-ignore:
      - '.github/workflows/**'
      - 'README.md'
  workflow_dispatch:

jobs:
  check-db-changes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Check for Database Changes
        id: check
        run: |
          if git diff --name-only HEAD^ HEAD | grep -qE '^database/(migrations|seeders)/'; then
            echo "run_migrations=true" >> $GITHUB_ENV
            echo "run_migrations=true" >> $GITHUB_OUTPUT
          else
            echo "run_migrations=false" >> $GITHUB_ENV
            echo "run_migrations=false" >> $GITHUB_OUTPUT
          fi
        shell: bash
    outputs:
      run_migrations: ${{ steps.check.outputs.run_migrations }}

  update-env:
    runs-on: ubuntu-latest
    needs: check-db-changes
    outputs:
      should_restart: ${{ steps.compare_env.outputs.should_restart }}
    steps:
      - name: Update RUN_MIGRATIONS in Server
        id: update_env
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          RUN_MIGRATIONS: ${{ needs.check-db-changes.outputs.run_migrations }}
        run: |
          echo "$SSH_PRIVATE_KEY" > private_key && chmod 600 private_key
          ssh -i private_key -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_IP -p 2323 << EOF
            CURRENT_VALUE=\$(grep '^RUN_MIGRATIONS=' ~/sipta/development/.env | cut -d '=' -f2)
            if [[ "\$CURRENT_VALUE" != "$RUN_MIGRATIONS" ]]; then
              sed -i 's/^RUN_MIGRATIONS=.*/RUN_MIGRATIONS=${RUN_MIGRATIONS}/' ~/sipta/development/.env
              echo "should_restart=true" >> $GITHUB_ENV
            else
              echo "should_restart=false" >> $GITHUB_ENV
            fi
          EOF
          rm -f private_key

      - name: Set Output for Restart Condition
        id: compare_env
        run: echo "should_restart=${should_restart}" >> $GITHUB_OUTPUT

  restart-docker-compose:
    runs-on: ubuntu-latest
    needs: update-env
    if: needs.update-env.outputs.should_restart == 'true'
    steps:
      - name: Restart Docker Compose
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SUDO_PASSWORD: ${{ secrets.SUDO_PASSWORD }}
        run: |
          echo "$SSH_PRIVATE_KEY" > private_key && chmod 600 private_key
          ssh -i private_key -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_IP -p 2323 \
            "cd ~/sipta/development && echo $SUDO_PASSWORD | sudo -S docker compose down && echo $SUDO_PASSWORD | sudo -S docker compose up -d"
          rm -f private_key

  build-push:
    runs-on: ubuntu-latest
    needs: update-env
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push App Docker Image
        run: |
          docker build -f Docker/Dockerfile/app.Dockerfile -t najibalimudin/sipta-app:dev .
          docker push najibalimudin/sipta-app:dev

      - name: Build and Push Web Server Docker Image
        run: |
          docker build -f Docker/Dockerfile/web_server.Dockerfile.dev -t najibalimudin/sipta-web_server:dev .
          docker push najibalimudin/sipta-web_server:dev
