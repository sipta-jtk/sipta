name: Deploy Staging

on:
  push:
    branches:
      - staging
    paths-ignore:
      - '.github/workflows/**'
      - 'README.md'
  workflow_dispatch:

jobs:
  checkout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

  check-db-changes:
    runs-on: ubuntu-latest
    needs: checkout
    outputs:
      run_migrations: ${{ steps.check.outputs.run_migrations }}
    steps:
      - name: Check for Database Changes
        id: check
        run: |
          if git diff --name-only HEAD^ HEAD | grep -qE '^database/(migrations|seeders)/'; then
            echo "run_migrations=true" >> $GITHUB_OUTPUT
          else
            echo "run_migrations=false" >> $GITHUB_OUTPUT
          fi
        shell: bash

  update-env:
    runs-on: ubuntu-latest
    needs: check-db-changes
    steps:
      - name: Update RUN_MIGRATIONS in Server
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          RUN_MIGRATIONS: ${{ needs.check-db-changes.outputs.run_migrations }}
        run: |
          ssh -i <(echo "$SSH_PRIVATE_KEY") -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_IP -p 2323 << EOF
            sed -i 's/^RUN_MIGRATIONS=.*/RUN_MIGRATIONS=${RUN_MIGRATIONS}/' ~/sipta/development/.env
            echo "Updated RUN_MIGRATIONS=${RUN_MIGRATIONS} in .env"
          EOF

  restart-docker-compose:
    runs-on: ubuntu-latest
    needs: update-env
    steps:
      - name: Restart Docker Compose
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SUDO_PASSWORD: ${{ secrets.SUDO_PASSWORD }}
        run: |
          ssh -i <(echo "$SSH_PRIVATE_KEY") -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_IP -p 2323 \
            "cd ~/sipta/development && echo $SUDO_PASSWORD | sudo -S docker compose down && echo $SUDO_PASSWORD | sudo -S docker compose up -d"

  build-push-docker-images:
    runs-on: ubuntu-latest
    needs: update-env
    strategy:
      matrix:
        image:
          - { name: app, dockerfile: Docker/Dockerfile/app.Dockerfile, tag: najibalimudin/sipta-app:dev }
          - { name: web_server, dockerfile: Docker/Dockerfile/web_server.Dockerfile.dev, tag: najibalimudin/sipta-web_server:dev }
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        run: |
          docker build -f ${{ matrix.image.dockerfile }} -t ${{ matrix.image.tag }} .
          docker push ${{ matrix.image.tag }}