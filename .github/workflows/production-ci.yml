name: Deploy Staging

on:
  push:
    branches:
      - staging
    paths-ignore:
      - '.github/workflows/**'
      - 'README.md'
  workflow_dispatch:

jobs:
  build-push-app:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push App Docker Image
        run: |
          docker build -f Docker/Dockerfile/app.Dockerfile -t najibalimudin/sipta-app:prod .
          docker push najibalimudin/sipta-app:prod

  build-push-web-server:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Web Server Docker Image
        run: |
          docker build -f Docker/Dockerfile/web_server.Dockerfile -t najibalimudin/sipta-web_server:prod .
          docker push najibalimudin/sipta-web_server:prod