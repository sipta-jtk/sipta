name: Deploy Production

on:
  push:
    branches:
      - production
    paths-ignore:
      - '.github/workflows/**'
      - 'README.md'

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Check for Database Changes
        id: check_db_changes
        run: |
          if git diff --name-only HEAD^ HEAD | grep -qE '^database/(migrations|seeders)/'; then
            echo "RUN_MIGRATIONS=true" >> $GITHUB_ENV
          else
            echo "RUN_MIGRATIONS=false" >> $GITHUB_ENV
          fi

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push App Docker Image
        run: |
          docker build -f Docker/Dockerfile/app.Dockerfile -t najibalimudin/sipta-app:prod .
          docker push najibalimudin/sipta-app:prod

      - name: Build and Push Web Server Docker Image
        run: |
          docker build -f Docker/Dockerfile/web_server.Dockerfile -t najibalimudin/sipta-web_server:prod .
          docker push najibalimudin/sipta-web_server:prod

      - name: Update RUN_MIGRATIONS in Server
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          echo "$SSH_PRIVATE_KEY" > private_key && chmod 600 private_key
          ssh -i private_key -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_IP << EOF
            sed -i 's/^RUN_MIGRATIONS=.*/RUN_MIGRATIONS=${{ env.RUN_MIGRATIONS }}/' ~/sipta/development/.env
            echo "Updated RUN_MIGRATIONS=${{ env.RUN_MIGRATIONS }} in .env"
          EOF
          rm -f private_key
