services:
  sipta-mysql:
    image: mysql:8.0
    container_name: sipta-mysql
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"  # Izinkan root tanpa password
      MYSQL_DATABASE: ${DB_DATABASE}  # Tetap buat database
    ports:
      - "3307:3306"
    volumes:
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./docker/mysql/data:/var/lib/mysql
